[package]
name = "squirrel-sys"
version = "0.2.1"
authors = ["robbymadruga@gmail.com"]
description = "FFI bindings to the squirrel language."
readme = "README.md"
license = "MIT"
repository = "https://github.com/robbym/squirrel-sys"
homepage = "https://github.com/robbym/squirrel-sys"
build = "build.rs"
edition = "2018"

[features]
double = []
# The heap census's access tracking (sq_censustrack): measurement builds only, since it
# hooks every table access. Without it sq_censustrack does nothing.
census = []

[build-dependencies]
bindgen = "0.52.0"
cmake = "0.1.42"
